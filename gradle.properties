org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 本机装有 JDK 21 / 25；toolchain 固定 21（NeoForge 1.21.1 面向 Java 21 终端用户）。
org.gradle.java.installations.paths=C:/Java/jdk-21,C:/Java/jdk-25
org.gradle.java.installations.auto-download=false

# Minecraft & NeoForge — 与 gradle/libs.versions.toml 保持一致
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.265
neo_version_range=[21.1.265,21.2.0)
loader_version_range=[4,5)

# Mod 信息
mod_id=thaumaturge_aspect_tooltip
mod_name=Thaumaturge Tooltip Plus
mod_version=0.1.2
mod_license=AGPL-3.0
mod_group_id=io.github.xingluo.thaumaturgeaspecttooltip
mod_authors=\u661F\u843D
mod_description=Client-side add-on for Thaumaturge: appends a text aspect line to item tooltips that have aspect data but no native text display.

# 前置版本下限（写进 neoforge.mods.toml）；Thaumaturge 本体 1.1.0 是当前编译基线。
thaumaturge_version=1.1.0
