plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Repositories for dev-only test mods declared by Maven coordinates below.
// Modrinth's maven.modrinth.com host is unreachable here; api.modrinth.com/maven
// serves the same maven/modrinth group and is used instead.
repositories {
    mavenLocal()
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.latvian.dev/releases' } }
        filter { includeGroupByRegex 'dev\\.latvian\\..*' }
    }
    // KubeJS transitive dependency: animated-gif-lib-for-java is only on JitPack,
    // with a non-semver version prefix.
    exclusiveContent {
        forRepository { maven { url = 'https://jitpack.io' } }
        filter { includeGroup 'com.github.rtyley' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.shedaniel.me/' } }
        filter { includeGroup 'me.shedaniel.cloth' }
    }
}

// NeoForge 1.21.1 ships Java 21 to end users.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    // Client-only tooltip code lives in its own source set so common/server code
    // can never accidentally reference client classes.
    client {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // runClient 走 clientRuntimeClasspath，它不会自动继承 localRuntime。
    // 必须显式接上，否则 dev 客户端加载不到 Thaumaturge 前置与测试套件。
    clientRuntimeClasspath.extendsFrom clientLocalRuntime, localRuntime
    testRuntimeClasspath.extendsFrom testLocalRuntime, localRuntime
}

neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    addModdingDependenciesTo(sourceSets.client)
    addModdingDependenciesTo(sourceSets.test)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
            sourceSet(sourceSets.test)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            sourceSet = sourceSets.client
            ideName = 'Client'
        }

        server {
            server()
            ideName = 'Server'
            programArguments.addAll '--nogui'
        }

        data {
            data()
            sourceSet = sourceSets.main
            ideName = 'Data Generation'
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
}

// The default Java component only contains sourceSets.main. Merge the client
// source set into the distributable jar.
tasks.named('jar', Jar) {
    dependsOn sourceSets.client.classesTaskName
    from sourceSets.client.output
    from('LICENSE') { into 'META-INF' }
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    dependsOn sourceSets.client.classesTaskName
}

// Generate mods.toml from the template before resources are processed.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        neo_version_range       : neo_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
        thaumaturge_version     : thaumaturge_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.named('processResources', ProcessResources) {
    dependsOn generateModMetadata
}

dependencies {
    // Thaumaturge: the API classes are needed at compile time to read aspects from
    // item stacks; the dev runtime loads the same jar so the client can actually boot.
    // The jar is a local file in libs/ (not tracked by git) - see docs/LOCAL_DEPS.md.
    compileOnly files('libs/thaumaturge-1.21.1-NeoForge-1.1.0.jar')
    clientCompileOnly files('libs/thaumaturge-1.21.1-NeoForge-1.1.0.jar')
    localRuntime files('libs/thaumaturge-1.21.1-NeoForge-1.1.0.jar')

    // Runtime prerequisites with official Modrinth Maven sources. Use coordinates,
    // never local jars: glodium is required by extendedae, lithostitched by thaumaturge.
    localRuntime 'maven.modrinth:glodium:1.21-2.2-neoforge'
    localRuntime 'maven.modrinth:lithostitched:1.8.1-neoforge-21.1'

    // Dev-only test suite, declared by Maven coordinates (preferred) so no jars
    // need to be committed or copied by hand. Versions match the reference modpack.
    // See docs/DEV_ENV.md for the roster and source repositories.
    localRuntime 'curse.maven:ae2-pattern-disk-1698612:9384288'
    localRuntime 'curse.maven:applied-energistics-2-223794:9519988'
    localRuntime 'curse.maven:architectury-api-419699:8492726'
    localRuntime 'curse.maven:curios-309927:6529130'
    localRuntime 'curse.maven:ftb-library-404465:9350706'
    localRuntime 'curse.maven:geckolib-388172:8893490'
    localRuntime 'curse.maven:guideme-1173950:9366366'
    localRuntime 'curse.maven:jade-324717:8591319'
    localRuntime 'curse.maven:modern-ui-352491:8206075'
    localRuntime 'curse.maven:spark-361579:6225208'
    localRuntime 'curse.maven:thaumic-energistics-ce-1731454:9623964'
    localRuntime 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381'
    localRuntime 'dev.latvian.mods:rhino:2101.2.7-build.85'
    localRuntime 'maven.modrinth:ae2-omni-cells:1.1.6-1.21.1-neoforge'
    localRuntime 'maven.modrinth:applied-energistics-2-wireless-terminals:19.5.1'
    localRuntime 'maven.modrinth:cloth-config:15.0.140+neoforge'
    localRuntime 'maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc1.21.1'
    localRuntime 'maven.modrinth:itemzoomer:2.0.1-1.21.1'
    localRuntime 'maven.modrinth:jade-addons-forge:6.1.2+neoforge'
    // Modrinth coordinates with opaque version segments use version IDs, not version numbers:
    // the same version_number can exist for multiple loaders and a bare number resolves to the
    // wrong artifact. AE2-Pattern-Disk documents the same trap for JECharacters.
    localRuntime 'maven.modrinth:justenoughcharacters:iNnJuUnx'
    localRuntime 'maven.modrinth:mezzconfig:V6oWFnxW'
    localRuntime 'maven.modrinth:mezzconfiggui:mc1.21.1-0.5.5'
    localRuntime 'maven.modrinth:mod-menu-neoforge-edition:1.0.2'
    localRuntime 'maven.modrinth:modernfix:5.27.27+mc1.21.1'
    localRuntime 'maven.modrinth:polymorph:VEburL70'
    localRuntime 'maven.modrinth:sodium:mc1.21.1-0.8.13-neoforge'
    localRuntime 'mezz.jei:jei-1.21.1-neoforge:19.70.0.469'

    // A handful of mods are not published to a Maven reachable here. Only the listed
    // jars load in the dev client; other Thaumaturge addon jars may stay on disk but
    // are intentionally excluded. See docs/DEV_ENV.md for the active subset.
    localRuntime fileTree('libs/devmods-local') {
        include 'ExtendedAE-1.21-2.2.43-neoforge.jar'
        include 'ae2jeiintegration-1.2.1.jar'
        include 'thaumaturge_tinkerer-1.21.1-0.3.jar'
        include 'thaumicbases-3.6.023.5-1.21.1.jar'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
