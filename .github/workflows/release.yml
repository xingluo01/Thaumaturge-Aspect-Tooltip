name: Release

# 推 tag（如 v0.1.2）即发布：校验凭据 → 构建 → Modrinth → CurseForge → GitHub Release。
#
# 更新日志优先从仓库里的 CHANGELOG.md 取当前版本的段落，取不到才退回按提交主题拼接。
#
# 需要在仓库里预先配置（Settings → Secrets and variables → Actions）：
#   Secrets   MODRINTH_TOKEN         Modrinth PAT。发版至少要 VERSION_CREATE（上传新版本）；
#                                    标准更新流程可再勾 VERSION_WRITE 与 PROJECT_WRITE。
#                                    scope 名以 VERSION_CREATE 为准（minotaur 文档写作
#                                    CREATE_VERSION 是笔误）。
#             CURSEFORGE_TOKEN       https://www.curseforge.com/account/api-tokens 生成的
#                                    站点账户 UUID token（不是 Eternal API console key）。
#   Variables MODRINTH_PROJECT_ID    可选覆盖；缺省使用 thaumaturge-tooltip-plus
#             CURSEFORGE_PROJECT_ID  可选覆盖；缺省使用 1825579（必须为数字项目 ID）
#
# 重跑同一个 tag：Modrinth 会因版本号已存在而失败，CurseForge 不去重、会再传一份。
# 发布中断后优先升版本号重发，不要直接重跑同一个 tag。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史，便于在 CHANGELOG.md 缺失对应段时回退生成说明

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate publish credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::缺少仓库 Secret: MODRINTH_TOKEN（Settings → Secrets and variables → Actions）"
            missing=1
          fi
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::缺少仓库 Secret: CURSEFORGE_TOKEN（Settings → Secrets and variables → Actions）"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # v6 起官方缓存组件有专有许可，cache-provider: basic 指回 MIT 的 @actions/cache。
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # gradle.properties 里的 org.gradle.java.installations.paths=C:/Java/jdk-21,C:/Java/jdk-25
      # 仅适用于 Windows 本地；在 Linux runner 上通过命令行属性覆盖为当前 JAVA_HOME。
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew build \
            -Pmod_version="$VERSION" \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx3G -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStoreType=JKS"

      - name: Collect changelog
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 优先取 CHANGELOG.md 中 "## [<版本>]" 到下一个 "## [" 之间的正文。
          # 用 index() 判头兼容 mawk（\[ 在 POSIX ERE 里属未定义行为）。
          BODY=""
          SOURCE="none"
          if [ -f CHANGELOG.md ]; then
            BODY=$(awk -v ver="$VERSION" '
              index($0, "## [") == 1 {
                if (found) exit
                if (index($0, "## [" ver "]") == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d')
            if [ -n "$BODY" ]; then SOURCE="CHANGELOG.md"; fi
          fi
          if [ -z "$BODY" ]; then
            SOURCE="commit log"
            PREVIOUS=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$PREVIOUS" ]; then
              BODY=$(git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS}..${GITHUB_REF_NAME}")
            else
              BODY=$(git log --no-merges --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}")
            fi
          fi
          echo "changelog source: $SOURCE (${#BODY} chars)"
          {
            echo "body<<CHANGELOG_EOF"
            echo "# Thaumaturge Tooltip Plus $VERSION 更新日志"
            echo
            echo "$BODY"
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || 'thaumaturge-tooltip-plus' }}
          MODRINTH_CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: >
          ./gradlew modrinth
          --no-configuration-cache
          -Pmod_version="$VERSION"
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx3G -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStoreType=JKS"

      - name: Publish to CurseForge
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID || '1825579' }}
          game_endpoint: minecraft
          file_path: build/libs/thaumaturge_tooltip_plus-${{ steps.ver.outputs.version }}.jar
          display_name: Thaumaturge Tooltip Plus ${{ steps.ver.outputs.version }} [NeoForge 1.21.1]
          release_type: release
          changelog: ${{ steps.changelog.outputs.body }}
          changelog_type: markdown
          # 传统接口 GET /api/game/versions 的数字 ID：
          #   1.21.1=11779  NeoForge=10150  Client=9638
          # 本模组为纯客户端功能，不勾选 Server(9639)。
          game_versions: '11779,10150,9638'
          # CurseForge 官方项目 slug 为 thaumaturge（数字 ID 1628024）；逗号分隔不加空格。
          relations: 'thaumaturge:requiredDependency'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: build/libs/thaumaturge_tooltip_plus-${{ steps.ver.outputs.version }}.jar
          fail_on_unmatched_files: true
